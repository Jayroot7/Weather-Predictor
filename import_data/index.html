<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather History Loader</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #202124;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            padding: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        h1 {
            margin: 0 0 6px;
            font-size: 24px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #666;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #3ecf8e;
            box-shadow: 0 0 0 3px rgba(62,207,142,0.12);
        }

        .actions {
            margin-top: 20px;
        }

        button {
            background: #3ecf8e;
            color: #062f20;
            border: none;
            border-radius: 6px;
            padding: 11px 20px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #35bc80;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .results h2 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px;
        }

        th,
        td {
            text-align: left;
            padding: 12px;
            border: 1px solid #e1e4e8;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
        }

        td {
            background: white;
        }

        .true {
            color: #168653;
            font-weight: 600;
        }

        .false {
            color: #d97706;
            font-weight: 600;
        }

        /* Toasts */

        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }

        .toast {
            min-width: 300px;
            max-width: 450px;
            background: #202124;
            color: white;
            padding: 14px 16px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            animation: slideIn .2s ease-out;
            font-size: 14px;
            line-height: 1.4;
        }

        .toast.success {
            border-left: 5px solid #3ecf8e;
        }

        .toast.error {
            border-left: 5px solid #ef4444;
        }

        .toast.info {
            border-left: 5px solid #3b82f6;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div id="toastContainer"></div>

<div class="container">

    <div class="card">

        <h1>Weather History Loader</h1>

        <p class="subtitle">
            Load or update historical weather data from Open-Meteo.
        </p>

        <form id="weatherForm">

            <div class="form-grid">

                <div class="field">
                    <label for="locationName">Location Name</label>
                    <input
                        id="locationName"
                        type="text"
                        value="Troon"
                        required
                    >
                </div>

                <div class="field">
                    <label for="latitude">Latitude</label>
                    <input
                        id="latitude"
                        type="number"
                        step="any"
                        value="55.54"
                        min="-90"
                        max="90"
                        required
                    >
                </div>

                <div class="field">
                    <label for="longitude">Longitude</label>
                    <input
                        id="longitude"
                        type="number"
                        step="any"
                        value="-4.66"
                        min="-180"
                        max="180"
                        required
                    >
                </div>

            </div>

            <div class="actions">

                <button id="runButton" type="submit">
                    Load Weather History
                </button>

            </div>

        </form>

        <div id="results" class="results">

            <h2>Results</h2>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Rows Upserted</th>
                            <th>Chunks Run</th>
                            <th>Loaded From</th>
                            <th>Loaded To</th>
                            <th>Finished</th>
                        </tr>
                    </thead>

                    <tbody id="resultsBody"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL = 'https://goupppehmpuwpuitkuyb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0i8HhBH-kjYoHhCYCzKLrA_EPN9UJ_Q';

const { createClient } = supabase;

const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const form = document.getElementById('weatherForm');
const runButton = document.getElementById('runButton');
const results = document.getElementById('results');
const resultsBody = document.getElementById('resultsBody');


function showToast(message, type = 'info') {

    const container = document.getElementById('toastContainer');

    const toast = document.createElement('div');

    toast.className = `toast ${type}`;

    toast.textContent = message;

    container.appendChild(toast);

    setTimeout(() => {
        toast.remove();
    }, 6000);
}


form.addEventListener('submit', async (event) => {

    event.preventDefault();

    const locationName =
        document.getElementById('locationName').value.trim();

    const latitude =
        Number(document.getElementById('latitude').value);

    const longitude =
        Number(document.getElementById('longitude').value);


    if (!locationName) {
        showToast('Location name is required.', 'error');
        return;
    }

    if (!Number.isFinite(latitude) || latitude < -90 || latitude > 90) {
        showToast('Latitude must be between -90 and 90.', 'error');
        return;
    }

    if (!Number.isFinite(longitude) || longitude < -180 || longitude > 180) {
        showToast('Longitude must be between -180 and 180.', 'error');
        return;
    }


    runButton.disabled = true;
    runButton.textContent = 'Loading...';

    results.style.display = 'none';

    showToast(
        `Loading weather history for ${locationName}...`,
        'info'
    );


    try {

        const { data, error } = await supabaseClient.rpc(
            'load_weather_history',
            {
                p_location_name: locationName,
                p_latitude: latitude,
                p_longitude: longitude
            }
        );


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {
            throw new Error(
                'The function completed but did not return a result.'
            );
        }


        resultsBody.innerHTML = '';


        data.forEach(row => {

            const tr = document.createElement('tr');

            const values = [
                row.rows_upserted,
                row.chunks_run,
                row.loaded_from,
                row.loaded_to,
                row.finished
            ];


            values.forEach((value, index) => {

                const td = document.createElement('td');

                if (index === 4) {

                    td.textContent =
                        value === true ? 'true' : 'false';

                    td.className =
                        value === true ? 'true' : 'false';

                } else {

                    td.textContent =
                        value ?? '';

                }

                tr.appendChild(td);

            });


            resultsBody.appendChild(tr);

        });


        results.style.display = 'block';


        const result = data[0];


        if (result.finished === true) {

            showToast(
                `Weather history for ${locationName} is fully up to date.`,
                'success'
            );

        } else {

            showToast(
                `Batch completed for ${locationName}. More history remains to be loaded.`,
                'success'
            );

        }

    }
    catch (error) {

        console.error(error);

        showToast(
            error.message || 'An unexpected error occurred.',
            'error'
        );

    }
    finally {

        runButton.disabled = false;
        runButton.textContent = 'Load Weather History';

    }

});

</script>

</body>
</html>
